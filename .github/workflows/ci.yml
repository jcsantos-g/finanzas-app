# Integración continua: se ejecuta en cada Pull Request y en cada push a main/develop.
# Si falla tipos, linter o pruebas, el PR no debería integrarse.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos (TypeScript)
        run: npm run typecheck
      - name: Linter
        run: npm run lint
      - name: Pruebas unitarias
        run: npm run test
